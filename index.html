ede garantizar. Pero sí puedes elegir cómo actuar con más claridad y respeto.</p><div class="offer"><span class="pill">Guía digital</span><h3>Mapa de la Reconquista</h3><p>Un plan de 30 días para evitar errores después de una ruptura, revisar lo que pasó y evaluar cómo actuar ante una posible reconexión.</p><ul><li>Un camino organizado para tus próximos 30 días</li><li>Errores frecuentes que pueden empeorar la distancia</li><li>Claves para evaluar si hay espacio para una conversación</li></ul><p><strong>No improvises tu próximo movimiento. Descubre cómo estructurar tus próximos 30 días.</strong></p><button class="btn" id="buy">Quiero descubrir el plan de 30 días →</button><p class="fine">La compra es opcional. Consulta el precio y las condiciones en el checkout.</p></div><button class="back" id="again">↺ Rehacer evaluación</button>`;document.getElementById('buy').onclick=()=>{if(CHECKOUT_URL.startsWith('https://')){fbq('track','InitiateCheckout',{content_name:'Mapa de la Reconquista'});setTimeout(()=>{window.location.href=CHECKOUT_URL},180);}else alert('Antes de publicar, configura el enlace real de Hotmart en CHECKOUT_URL dentro de index.html.');};document.getElementById('again').onclick=()=>{answers=[];step=-1;render()};}
